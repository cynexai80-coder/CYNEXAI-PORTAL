[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Route redirects to Netlify Serverless Functions
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200
  force = true

# Single Page App (SPA) redirect - must be LAST and NOT force
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
